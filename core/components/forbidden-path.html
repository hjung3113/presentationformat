<!--
@component forbidden-path
@kind figure
@order 140
@shape forbidden-path
@title 금지 경로와 허용 대안
@use "A를 B로 바로 바꾸면 안 된다, 대신 C로 간다"가 주장이다. 금지된 자동 변환·지름길과 그것을 대신하는 정식 경로를 함께 보여 준다.
@avoid 여러 조건에 따른 허용 여부 표 → decision-table. 단순 주의 한 줄 → callout(WARN).
@limits 허용 경로 1–4, 금지 경로 1–2
@data allowed: 출발 → 대안 경로들 | forbidden: 출발 ✕ 금지된 도착 (이유)
HOW TO FILL
  1. 왼쪽 = 허용 경로(강조색), 오른쪽 = 금지 경로(경고색). 가운데 ≠ 표시는 그대로 둔다.
  2. 허용 쪽 노드는 ▼REPEAT 로 늘린다. 금지 쪽에는 금지 이유를 반드시 한 줄로 적는다.
  3. 금지 쪽에 강조색을 쓰지 않는다. 두 쪽 출발 노드는 같은 이름이어야 비교가 성립한다.
-->
<div data-component="forbidden-path" style="background:⟨fig-tint⟩; border:1px solid ⟨border-fig⟩; border-radius:⟨r:card-sm⟩; padding:24px; overflow-wrap:anywhere;">
  <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:14px; align-items:center;">
    <!-- allowed -->
    <div style="background:⟨white⟩; border:1px solid ⟨accent-line⟩; border-radius:⟨r:card-sm⟩; padding:18px; flex:1 1 230px; min-width:0;">
      <div style="margin-bottom:12px;"><span style="font:700 10.5px/1 ⟨f:body⟩; color:⟨ok⟩; background:⟨ok-bg⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">✓ 허용</span></div>
      <div style="font:600 12.5px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦출발 노드⟧</div>
      <div style="text-align:center; color:⟨muted-300⟩; font:400 14px/1 ⟨f:body⟩; padding:6px 0;">↓</div>
      <div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px;">
        <!-- ▼ REPEAT per allowed destination -->
        <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; padding:9px 8px; text-align:center;">⟦허용 경로 A⟧</div>
        <!-- ▲ /REPEAT -->
        <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; padding:9px 8px; text-align:center;">⟦허용 경로 B⟧</div>
        <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; padding:9px 8px; text-align:center;">⟦허용 경로 C⟧</div>
        <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; padding:9px 8px; text-align:center;">⟦허용 경로 D⟧</div>
      </div>
    </div>
    <!-- separator -->
    <div style="width:36px; height:36px; border-radius:⟨r:circle⟩; background:⟨white⟩; border:1.5px solid ⟨warn-line⟩; color:⟨warn⟩; display:flex; align-items:center; justify-content:center; font:700 17px/1 ⟨f:body⟩; flex:none; margin:0 3px;">≠</div>
    <!-- forbidden -->
    <div style="background:⟨warn-bg⟩; border:1px solid ⟨warn-line⟩; border-radius:⟨r:card-sm⟩; padding:18px; flex:1 1 230px; min-width:0;">
      <div style="margin-bottom:12px;"><span style="font:700 10.5px/1 ⟨f:body⟩; color:⟨warn⟩; background:⟨white⟩; border:1px solid ⟨warn-line⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">✕ 금지</span></div>
      <div style="font:600 12.5px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦출발 노드⟧</div>
      <div style="text-align:center; color:⟨warn⟩; font:600 12px/1 ⟨f:body⟩; padding:7px 0;">✕ ↓</div>
      <div style="font:600 12.5px/1.35 ⟨f:body⟩; color:⟨warn⟩; background:⟨white⟩; border:1px dashed ⟨warn⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦금지된 도착⟧</div>
      <div style="font:400 12px/1.6 ⟨f:body⟩; color:⟨warn-2⟩; margin-top:10px; text-align:center;">⟦금지 이유 한 줄⟧</div>
    </div>
  </div>
</div>
