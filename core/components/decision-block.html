<!--
@component decision-block
@kind report
@order 340
@shape decision
@title 결정 블록 — 결정 요청·선택지·권고
@use 독자에게 결정을 요청한다. 무엇을 결정해야 하는지, 선택지별 장단점, 권고안, 언제까지 누가 정하는지를 놓치지 않게 보여 준다.
@avoid 결정이 아니라 미정 질문 여러 개 → table(항목 / 현재 방향 / 결정 필요). 주의 한 줄 → callout.
@limits 선택지 2–3, 장단점 각 1–3줄
@data question: 결정할 질문 | options: A 이름(+장점, −단점), B … | recommend: A (근거) | due: 날짜 | owner: 결정 주체 | if-not: 미결정 시 영향
HOW TO FILL
  1. 질문은 한 문장, 예/아니오 또는 A/B로 답할 수 있게 쓴다.
  2. 선택지 수 K에 맞춰 grid-template-columns:repeat(K,1fr). 권고 선택지만 "권고" 변형(강조 테두리 + 배지).
  3. + 줄은 성공색, − 줄은 경고 보조색. 각 1–3줄 개조식.
  4. 아래 메타 줄(결정 시점·결정 주체·미결정 시 영향)은 비우지 않는다. 모르면 "추후 확정"을 회색으로.
  5. 고정 라벨은 모두 슬롯이다: ⟦DECISION⟧ · ⟦권고⟧(배지) · ⟦권고 —⟧(권고 문장 머리) · ⟦DUE⟧ · ⟦OWNER⟧ · ⟦IF UNDECIDED⟧. 예시는 영문 기본(labels: en)이고
     권고 두 곳은 한글 "권고"가 기본이다(영문 문서는 RECOMMENDED / RECOMMENDATION —). labels: ko 문서(경영진·사용자용)는
     "결정" · "권고" · "권고 —" · "기한" · "결정 주체" · "미결정 시" 로 바꾼다 (core/components.md §4 "라벨 언어").
  6. 결정 블록은 문서당 1–2개(3개 이상이면 플랜 검증이 경고한다). "이 섹션이 요청 자체"일 때만 쓰고, 결정을 암시할 뿐인 섹션에는 쓰지 않는다.
     섹션 맨 위나 결론 섹션에 둔다(pitch 문서는 마지막 섹션). 작은 카드 안에 숨기지 않는다.
-->
<div data-component="decision-block" style="border:1.5px solid ⟨accent⟩; border-radius:⟨r:card⟩; background:⟨white⟩; overflow:hidden;">
  <div style="background:⟨accent⟩; padding:14px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <span style="font:700 10.5px/1 ⟨f:mono⟩; letter-spacing:.08em; color:⟨accent⟩; background:⟨white⟩; border-radius:⟨r:pill-sm⟩; padding:5px 8px;">⟦DECISION⟧</span>
    <span style="font:600 16px/1.4 ⟨f:body⟩; color:⟨white⟩;">⟦결정할 질문 한 문장⟧</span>
  </div>
  <div style="padding:18px 22px 20px;">
    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px;">
      <!-- VARIANT recommended option -->
      <div style="border:1.5px solid ⟨accent⟩; border-radius:⟨r:card-sm⟩; padding:14px 16px; background:⟨accent-050⟩;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><span style="font:700 11px/1 ⟨f:mono⟩; color:⟨white⟩; background:⟨accent⟩; border-radius:⟨r:pill-sm⟩; padding:4px 7px;">A</span><span style="font:600 14px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦선택지 A 이름⟧</span><span style="margin-left:auto; font:700 10.5px/1 ⟨f:body⟩; color:⟨accent⟩; border:1px solid ⟨accent⟩; border-radius:⟨r:pill⟩; padding:4px 8px;">⟦권고⟧</span></div>
        <div style="font:400 12.5px/1.65 ⟨f:body⟩; color:⟨ok⟩;">+ ⟦장점 한 줄⟧</div>
        <div style="font:400 12.5px/1.65 ⟨f:body⟩; color:⟨warn-2⟩;">− ⟦단점 한 줄⟧</div>
      </div>
      <!-- ▼ REPEAT per other option -->
      <div style="border:1px solid ⟨border⟩; border-radius:⟨r:card-sm⟩; padding:14px 16px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><span style="font:700 11px/1 ⟨f:mono⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 7px;">B</span><span style="font:600 14px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦선택지 B 이름⟧</span></div>
        <div style="font:400 12.5px/1.65 ⟨f:body⟩; color:⟨ok⟩;">+ ⟦장점 한 줄⟧</div>
        <div style="font:400 12.5px/1.65 ⟨f:body⟩; color:⟨warn-2⟩;">− ⟦단점 한 줄⟧</div>
      </div>
      <!-- ▲ /REPEAT -->
    </div>
    <div style="margin-top:14px; background:⟨accent-050⟩; border-left:3px solid ⟨accent⟩; border-radius:0 ⟨r:node⟩ ⟨r:node⟩ 0; padding:11px 14px; font:400 13px/1.65 ⟨f:body⟩; color:⟨ink-700⟩;"><b style="color:⟨accent⟩;">⟦권고 —⟧</b> ⟦권고 선택지와 근거 한 문장.⟧</div>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px; padding-top:12px; border-top:1px solid ⟨border-row⟩;">
      <div><div style="font:700 10px/1 ⟨f:mono⟩; letter-spacing:.06em; color:⟨muted-text⟩; margin-bottom:5px;">⟦DUE⟧</div><div style="font:600 12.5px/1.4 ⟨f:body⟩; color:⟨ink-800⟩;">⟦YYYY-MM-DD⟧</div></div>
      <div><div style="font:700 10px/1 ⟨f:mono⟩; letter-spacing:.06em; color:⟨muted-text⟩; margin-bottom:5px;">⟦OWNER⟧</div><div style="font:600 12.5px/1.4 ⟨f:body⟩; color:⟨ink-800⟩;">⟦결정 주체⟧</div></div>
      <div><div style="font:700 10px/1 ⟨f:mono⟩; letter-spacing:.06em; color:⟨muted-text⟩; margin-bottom:5px;">⟦IF UNDECIDED⟧</div><div style="font:600 12.5px/1.4 ⟨f:body⟩; color:⟨ink-800⟩;">⟦미결정 시 영향⟧</div></div>
    </div>
  </div>
</div>
