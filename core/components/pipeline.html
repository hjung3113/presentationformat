<!--
@component pipeline
@kind figure
@order 80
@shape data-flow
@title 데이터 흐름 — 단계별 입력·처리·출력
@use 무엇이 들어와서(입력) 어떤 처리를 거쳐 어디로 나가는지(출력)가 주장이다. 여러 출처가 합류하거나 한 처리 결과가 여러 곳으로 퍼진다. ETL, 수집·정제·적재, 근거→판단→실행.
@avoid 사람의 업무 순서 → process-row/swimlane. 층 구조와 소속 → layer-map. 분기 조건이 핵심 → activity.
@limits 단계 3–5, 단계당 노드 1–4
@data stages: 입력[노드 A, 노드 B] → 처리[노드 C, 노드 D [planned]] → 출력[노드 E, 노드 F] | arrow-labels?: 전달 항목 1, 전달 항목 2
HOW TO FILL
  1. 단계 하나 = ▼REPEAT 블록(머리표 + 노드 1–4개). 단계 사이에 화살표 칸을 하나씩 둔다(마지막 단계 뒤에는 없음).
  2. 화살표 칸 아래 작은 글씨로 무엇이 넘어가는지(데이터·이벤트 이름)를 적는다. 모르면 비우지 말고 화살표만 둔다.
  3. 노드 변형: 일반=흰 노드, 저장소·큐=점선 노드, 최종 목적지=강조 노드(한 개), 아직 없는 노드=예정 노드.
     아직 없는 노드(계획·예정·미구현)는 figure-data 에서 노드 뒤 "[planned]" 로 적고 → 예정 변형(흐린 점선 + 상태 칩)으로 그린다.
     칩 문구는 출처의 상태 그대로(예정·계획·미설계·미구현·대기). 구축된 노드와 같은 모양으로 그리지 않는다(core/components.md §4 공통 규칙).
  4. 합류(여러 → 하나)·분산(하나 → 여러)은 단계의 노드 수로 표현한다. 선을 따로 그리지 않는다.
  5. figure-data 의 화살표(→)는 ASCII 꺾쇠 형태(->)로 적어도 같은 뜻이다.
-->
<div data-component="pipeline" style="background:⟨fig-tint⟩; border:1px solid ⟨border-fig⟩; border-radius:⟨r:card-sm⟩; padding:24px; overflow-x:auto; overflow-wrap:anywhere;">

      <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦노드 A2⟧<span style="display:block; font:400 10.5px/1.4 ⟨f:body⟩; color:⟨muted-text⟩; margin-top:2px;">⟦부가 설명⟧</span></div>

      <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px dashed ⟨dashed-store⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦저장소·큐 노드⟧<span style="display:block; font:400 10.5px/1.4 ⟨f:body⟩; color:⟨muted-text⟩; margin-top:2px;">⟦부가 설명⟧</span></div>

    <div style="flex:0 0 64px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:20px;">
