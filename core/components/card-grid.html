<!--
@component card-grid
@kind content
@order 400
@shape peer-list
@title 번호 카드 그리드 — 동급 항목 나열
@use 서로 동등한 항목 3–6개를 나열한다: 문제점, 발견 사항, 원칙, 리스크(등급 없음), 요구사항. 항목 사이에 순서·흐름·관계가 없다.
@avoid 항목 사이에 순서가 있다 → process-row. 관계·연결이 있다 → er-relations/layer-map. 행과 열이 모두 의미가 있다 → table/matrix. 이미 도식이 있는 섹션에 "더 자세히"를 덧붙이는 용도로 쓰지 않는다.
@limits 카드 3–6 (2열), 짧은 글로스면 3열
@data items: 번호 · 제목(명사구) · 설명 1–3문장
HOW TO FILL
  1. 카드 본문이 한 문단이면 2열(기본), 두 줄 이하 글로스면 grid-template-columns:repeat(3,1fr).
  2. 카드 하나 = ▼REPEAT 하나. 번호 칩은 섹션 번호.항목 번호(2.1, 2.2 …).
  3. 카드 4개 이상이면 아래 결론 칩(→ 한 줄 종합)으로 그리드를 닫는다. 아니면 지운다.
  4. 리스크(대응책 포함)는 "왼쪽 강조선 카드" 변형을 쓴다.
-->
<div data-component="card-grid">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
    <!-- ▼ REPEAT per card -->
    <div style="border:1px solid ⟨border⟩; border-radius:⟨r:card⟩; padding:20px 22px; background:⟨white⟩;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:9px;"><span style="font:700 12px/1 ⟨f:mono⟩; color:⟨accent⟩; background:⟨accent-050⟩; border-radius:⟨r:pill-sm⟩; padding:6px 9px;">⟦2.1⟧</span><span style="font:600 15.5px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦흩어진 접수 경로⟧</span></div>
      <div style="font:400 14px/1.7 ⟨f:body⟩; color:⟨body⟩;">⟦VOC와 설문 응답이 서로 다른 화면에서 들어와 중복·유사 판단이 개인 기억에 의존한다.⟧</div>
    </div>
    <!-- ▲ /REPEAT -->
    <div style="border:1px solid ⟨border⟩; border-radius:⟨r:card⟩; padding:20px 22px; background:⟨white⟩;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:9px;"><span style="font:700 12px/1 ⟨f:mono⟩; color:⟨accent⟩; background:⟨accent-050⟩; border-radius:⟨r:pill-sm⟩; padding:6px 9px;">⟦2.2⟧</span><span style="font:600 15.5px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦설명되지 않는 실행⟧</span></div>
      <div style="font:400 14px/1.7 ⟨f:body⟩; color:⟨body⟩;">⟦Task가 왜 시작되었는지, 어떤 근거가 있었는지 추적하기 어렵다.⟧</div>
    </div>
    <div style="border:1px solid ⟨border⟩; border-radius:⟨r:card⟩; padding:20px 22px; background:⟨white⟩;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:9px;"><span style="font:700 12px/1 ⟨f:mono⟩; color:⟨accent⟩; background:⟨accent-050⟩; border-radius:⟨r:pill-sm⟩; padding:6px 9px;">⟦2.3⟧</span><span style="font:600 15.5px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦닫히지 않는 검증⟧</span></div>
      <div style="font:400 14px/1.7 ⟨f:body⟩; color:⟨body⟩;">⟦Task 완료가 곧 사용자 문제 해결을 뜻하지 않아 결과 확인이 빠진다.⟧</div>
    </div>
    <!-- VARIANT risk card (left accent rule + mitigation) -->
    <div style="border:1px solid ⟨border⟩; border-left:3px solid ⟨accent⟩; border-radius:0 ⟨r:card-sm⟩ ⟨r:card-sm⟩ 0; padding:16px 20px; background:⟨white⟩;">
      <div style="font:600 15px/1.35 ⟨f:body⟩; color:⟨ink-900⟩; margin-bottom:6px;">⟦연결 누락⟧</div>
      <div style="font:400 13px/1.65 ⟨f:body⟩; color:⟨muted-500⟩;">⟦링크가 없으면 후속 공백이 보이지 않는다.⟧</div>
      <div style="font:400 13px/1.65 ⟨f:body⟩; color:⟨body⟩; margin-top:4px;">→ ⟦정책 기반 recovery 큐로 노출한다.⟧</div>
    </div>
  </div>
  <!-- OPTIONAL closing takeaway chip (4+ cards) -->
  <div style="margin-top:14px; background:⟨accent-050⟩; border:1px solid ⟨accent-line2⟩; border-radius:⟨r:card-sm⟩; padding:11px 16px; font:500 12.5px/1.5 ⟨f:body⟩; color:⟨accent⟩;">→ ⟦세 문제 모두 '연결이 기록되지 않는다'는 한 지점에서 출발한다.⟧</div>
</div>
