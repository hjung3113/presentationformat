<!--
@component status-board
@kind report
@order 300
@shape status
@title 상태 보드 — 작업 흐름별 상태·진척·메모
@use 여러 작업 흐름(워크스트림·마일스톤·팀)의 현재 상태를 한눈에 보고한다. 주간·월간 상태 보고, 프로젝트 현황.
@avoid 날짜별 사건 → timeline. 일정 계획 → gantt. 상태 전이 규칙 → state-machine.
@limits 행 3–7
@data rows: 작업명(담당) | 상태: 정상|주의|차단|완료|대기 | 진척 % | 메모 한 줄
HOW TO FILL
  1. 행 하나 = ▼REPEAT 행 하나. 차단·주의를 위로, 완료를 아래로 정렬하면 읽는 사람이 먼저 볼 것을 먼저 본다.
  2. 상태 배지 변형(글자 그대로 사용):
       정상 = 강조색 · 완료 = 성공색 · 주의 = 경고 보조색 · 차단 = 경고색 · 대기 = 회색
  3. 진척 막대 width = 진척 %. 모르면 막대 칸에 "—".
  4. 메모는 다음 행동이나 막힌 이유 한 줄(개조식).
-->
<div data-component="status-board" style="border:1px solid ⟨border⟩; border-radius:⟨r:card-sm⟩; overflow:hidden; background:⟨white⟩;">
  <div style="display:grid; grid-template-columns:1.5fr 88px 1fr 1.8fr; gap:14px; padding:11px 18px; background:⟨table-header-soft⟩; font:600 12px/1.3 ⟨f:body⟩; color:⟨ink-700⟩;">
    <span>⟦작업 흐름⟧</span><span>⟦상태⟧</span><span>⟦진척⟧</span><span>⟦메모⟧</span>
  </div>
  <!-- VARIANT 차단 (blocked) -->
  <div style="display:grid; grid-template-columns:1.5fr 88px 1fr 1.8fr; gap:14px; padding:12px 18px; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div><div style="font:600 13px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦권한 요청 승인⟧</div><div style="font:400 11.5px/1.4 ⟨f:body⟩; color:⟨muted-400⟩;">⟦Admin · 2명⟧</div></div>
    <span style="justify-self:start; font:700 11px/1 ⟨f:body⟩; color:⟨warn⟩; background:⟨warn-bg⟩; border:1px solid ⟨warn-line⟩; border-radius:⟨r:pill-sm⟩; padding:5px 8px;">차단</span>
    <div style="display:flex; align-items:center; gap:8px;"><div style="flex:1; height:8px; background:⟨fill-100⟩; border-radius:4px;"><div style="width:35%; height:100%; background:⟨warn⟩; border-radius:4px;"></div></div><span style="font:600 11px/1 ⟨f:mono⟩; color:⟨muted-500⟩;">⟦35%⟧</span></div>
    <span style="font:400 12.5px/1.5 ⟨f:body⟩; color:⟨body⟩;">⟦보안 검토 대기 — 10/12 결정 필요⟧</span>
  </div>
  <!-- VARIANT 주의 (at risk) -->
  <div style="display:grid; grid-template-columns:1.5fr 88px 1fr 1.8fr; gap:14px; padding:12px 18px; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div><div style="font:600 13px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦결과 설문 연동⟧</div><div style="font:400 11.5px/1.4 ⟨f:body⟩; color:⟨muted-400⟩;">⟦Survey · 3명⟧</div></div>
    <span style="justify-self:start; font:700 11px/1 ⟨f:body⟩; color:⟨warn-2⟩; background:⟨fill-100⟩; border:1px solid ⟨border-chip⟩; border-radius:⟨r:pill-sm⟩; padding:5px 8px;">주의</span>
    <div style="display:flex; align-items:center; gap:8px;"><div style="flex:1; height:8px; background:⟨fill-100⟩; border-radius:4px;"><div style="width:55%; height:100%; background:⟨accent-soft⟩; border-radius:4px;"></div></div><span style="font:600 11px/1 ⟨f:mono⟩; color:⟨muted-500⟩;">⟦55%⟧</span></div>
    <span style="font:400 12.5px/1.5 ⟨f:body⟩; color:⟨body⟩;">⟦응답 임계치 정책 미확정⟧</span>
  </div>
  <!-- ▼ REPEAT per workstream — 정상 (on track) -->
  <div style="display:grid; grid-template-columns:1.5fr 88px 1fr 1.8fr; gap:14px; padding:12px 18px; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div><div style="font:600 13px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦Task Request 리뷰⟧</div><div style="font:400 11.5px/1.4 ⟨f:body⟩; color:⟨muted-400⟩;">⟦Task · 4명⟧</div></div>
    <span style="justify-self:start; font:700 11px/1 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1px solid ⟨accent-line⟩; border-radius:⟨r:pill-sm⟩; padding:5px 8px;">정상</span>
    <div style="display:flex; align-items:center; gap:8px;"><div style="flex:1; height:8px; background:⟨fill-100⟩; border-radius:4px;"><div style="width:70%; height:100%; background:⟨accent⟩; border-radius:4px;"></div></div><span style="font:600 11px/1 ⟨f:mono⟩; color:⟨muted-500⟩;">⟦70%⟧</span></div>
    <span style="font:400 12.5px/1.5 ⟨f:body⟩; color:⟨body⟩;">⟦일괄 검토 UI 마무리⟧</span>
  </div>
  <!-- ▲ /REPEAT -->
  <!-- VARIANT 완료 (done) -->
  <div style="display:grid; grid-template-columns:1.5fr 88px 1fr 1.8fr; gap:14px; padding:12px 18px; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div><div style="font:600 13px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦VOC 트리아지 콘솔⟧</div><div style="font:400 11.5px/1.4 ⟨f:body⟩; color:⟨muted-400⟩;">⟦VOC · 3명⟧</div></div>
    <span style="justify-self:start; font:700 11px/1 ⟨f:body⟩; color:⟨ok⟩; background:⟨ok-bg⟩; border:1px solid ⟨ok-bg⟩; border-radius:⟨r:pill-sm⟩; padding:5px 8px;">완료</span>
    <div style="display:flex; align-items:center; gap:8px;"><div style="flex:1; height:8px; background:⟨fill-100⟩; border-radius:4px;"><div style="width:100%; height:100%; background:⟨ok⟩; border-radius:4px;"></div></div><span style="font:600 11px/1 ⟨f:mono⟩; color:⟨muted-500⟩;">⟦100%⟧</span></div>
    <span style="font:400 12.5px/1.5 ⟨f:body⟩; color:⟨body⟩;">⟦9/30 배포⟧</span>
  </div>
  <!-- VARIANT 대기 (not started) -->
  <div style="display:grid; grid-template-columns:1.5fr 88px 1fr 1.8fr; gap:14px; padding:12px 18px; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div><div style="font:600 13px/1.35 ⟨f:body⟩; color:⟨ink-900⟩;">⟦Evidence 화면⟧</div><div style="font:400 11.5px/1.4 ⟨f:body⟩; color:⟨muted-400⟩;">⟦Integration · 미정⟧</div></div>
    <span style="justify-self:start; font:700 11px/1 ⟨f:body⟩; color:⟨muted-500⟩; background:⟨white⟩; border:1px solid ⟨border-chip⟩; border-radius:⟨r:pill-sm⟩; padding:5px 8px;">대기</span>
    <span style="font:600 11px/1 ⟨f:mono⟩; color:⟨muted-400⟩;">—</span>
    <span style="font:400 12.5px/1.5 ⟨f:body⟩; color:⟨body⟩;">⟦다음 분기 착수⟧</span>
  </div>
</div>
