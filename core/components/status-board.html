<!--
@component status-board
@kind report
@order 300
@shape status
@title 상태 보드 — 작업 흐름별 상태·진척·메모
@use 여러 작업 흐름(워크스트림·마일스톤·팀)의 현재 상태를 한눈에 보고한다. 주간·월간 상태 보고, 프로젝트 현황.
@avoid 날짜별 사건 → timeline. 일정 계획 → gantt. 상태 전이 규칙 → state-machine.
@limits 행 3–7
@limits-x rows=3..7
@data rows: 작업명(담당) · 상태(정상|주의|차단|완료|대기) · 진척 %(출처에 진척이 없으면 이 열을 뺀다) · 메모 한 줄 …
HOW TO FILL
  1. 행 하나 = ▼REPEAT 행 하나. 차단·주의를 위로, 완료를 아래로 정렬하면 읽는 사람이 먼저 볼 것을 먼저 본다.
  2. 상태 배지는 변형(색)과 글자를 짝지어 쓴다. 글자는 슬롯이므로 직접 채우고, 색은 복사한 행의 것을 그대로 둔다:
       정상 = 강조색 · 완료 = 성공색 · 주의 = 경고 보조색 · 차단 = 경고색 · 대기 = 회색
  3. 진척 막대 width 슬롯(%)과 오른쪽 값 글자 슬롯은 같은 값으로 함께 채운다(예: 35 와 35%). 모르면 막대 칸에 "—".
  4. 메모는 다음 행동이나 막힌 이유 한 줄(개조식).
  5. 진척 막대가 있는 행(대기 행 제외)의 행 div 에 data-value 속성이 있다. 지우지 않고 진척 값 글자가 보여 주는 숫자로 채운다(35% 면 35). 게이트의 chart-proportions 가 진척 막대 width 와 견준다(±2). 대기 행은 막대가 없으므로 속성도 없다.
  6. 출처가 상태만 주고 진척 수치를 주지 않으면 진척 열을 통째로 뺀다(막대를 지어내지 않는다). 맨 아래 VARIANT no progress 의 머리 칸과 행을 쓴다:
       머리 칸은 ⟦진척⟧ 칸 없는 세 칸짜리(접힘 폭 502px 은 368px — 두 곳 모두)로 바꾸고, 모든 행에서 진척 셀(막대와 값, 대기 행은 —)과 행의 data-value 속성을 지운다.
       막대가 없으니 chart-proportions 가 읽을 것도 없고 "data-value 가 없다"는 NOTE 도 나오지 않는다. 진척을 쓰는 보드는 모든 행에 막대를 둔다(대기 행만 —).
  7. 좁은 폭(390px 화면의 343px 시트): 한 줄에 칸이 다 안 들어가면(상자 폭 502px 미만, 진척 없는 보드는 368px 미만) 행이 두 줄이 된다 —
     작업 흐름·상태 / 진척·메모(진척 없는 보드는 작업 흐름·상태 / 메모). 가로 스크롤 없이 메모까지 보인다. 이때 머리 칸은 접힌다(padding·font-size 가 0 이 될 뿐 잘리는 것은 없다).
     칸 하한(96 · 88 · 120 · 120)과 flex 값은 머리 칸과 모든 행이 같아야 한 줄일 때 칸이 세로로 정렬된다. 행은 flex-wrap 이고 칸마다 flex-basis 0 + min-width 하한이라
     넓을 때는 예전의 격자(1.5fr 88px 1fr 1.8fr)와 같은 비율이다. 상자 root 의 container-type:inline-size 가 머리 칸의 100cqw 기준이다.
     root 의 width:100% · box-sizing:border-box 는 지우지 않는다 — container-type 때문에 root 에는 고유 폭이 없어, 내용 폭을 따르는 상자(flex 열의 flex-start·center)에서 2px 로 접힌다(core/components.md §4).
-->
