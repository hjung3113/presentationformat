<!--
@component tree
@kind figure
@order 85
@shape hierarchy
@title 계층 트리 — 상위·하위 소속
@use 하나가 여러 하위로 나뉘는 소속·분류 구조가 주장이다. 메뉴·정보 구조(IA), 조직, 시스템 아래 모듈, 분류 체계.
@avoid 층 사이 호출·연결이 핵심 → layer-map. 순서나 흐름 → process-row/pipeline. 코드 상속 → class-diagram.
@limits 하위 2–5, 하위당 잎 0–5
@data root: 이름 | children: 이름[잎, 잎], 이름[잎] …
HOW TO FILL
  1. K = 하위 노드 수. 두 곳을 고친다:
       하위 그리드  grid-template-columns:repeat(K,1fr)
       가로 레일    margin:0 X%   (K=2 → 25%, K=3 → 16.667%, K=4 → 12.5%, K=5 → 10%)
  2. 하위 노드 하나 = ▼REPEAT 블록(세로 줄기 + 노드 + 잎 칩들). 잎이 없으면 잎 줄을 지운다.
  3. 루트는 강조 채움 노드 한 개. 이 문서의 주제인 하위 노드 하나만 강조 노드로.
-->
<div data-component="tree" style="background:⟨fig-tint⟩; border:1px solid ⟨border-fig⟩; border-radius:⟨r:card-sm⟩; padding:24px;">
  <div style="display:flex; flex-direction:column; align-items:center;">
    <div style="font:700 13px/1.3 ⟨f:body⟩; color:⟨white⟩; background:⟨accent⟩; border-radius:⟨r:node-lg⟩; padding:11px 22px; text-align:center;">⟦FeedbackOps⟧</div>
    <div style="width:0; height:14px; border-left:2px solid ⟨accent-line⟩;"></div>
    <!-- rail: margin = 50/K % -->
    <div style="align-self:stretch; margin:0 12.5%; border-top:2px solid ⟨accent-line⟩;"></div>
    <!-- children: repeat(K,1fr) -->
    <div style="align-self:stretch; display:grid; grid-template-columns:repeat(4,1fr); gap:12px;">
      <!-- ▼ REPEAT per child -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:0; height:14px; border-left:2px solid ⟨accent-line⟩;"></div>
        <div style="align-self:stretch; font:600 12.5px/1.35 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦VOC⟧</div>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-top:8px;">
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Inbox⟧</span>
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Triage⟧</span>
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Cluster⟧</span>
        </div>
      </div>
      <!-- ▲ /REPEAT -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:0; height:14px; border-left:2px solid ⟨accent-line⟩;"></div>
        <div style="align-self:stretch; font:600 12.5px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦Finding⟧</div>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-top:8px;">
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Evidence⟧</span>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:0; height:14px; border-left:2px solid ⟨accent-line⟩;"></div>
        <div style="align-self:stretch; font:600 12.5px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦Task⟧</div>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-top:8px;">
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Request⟧</span>
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Board⟧</span>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:0; height:14px; border-left:2px solid ⟨accent-line⟩;"></div>
        <div style="align-self:stretch; font:600 12.5px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px; text-align:center;">⟦Survey⟧</div>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-top:8px;">
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Builder⟧</span>
          <span style="font:400 11px/1.3 ⟨f:body⟩; color:⟨body⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦Result⟧</span>
        </div>
      </div>
    </div>
  </div>
</div>
