<!--
@component decision-table
@kind report
@order 350
@shape rule-table
@title 결정 표 — 조건 조합 → 결과
@use 몇 가지 조건의 조합에 따라 결과가 정해지는 규칙이 주장이다. 큐 포함 규칙, 분류 정책, 공개 여부, 자동화 여부. 조건들이 서로 독립적이고 행끼리 비교된다.
@avoid 판단이 순서대로 이어진다 → activity. 대상×기능의 허용 여부 → matrix.
@limits 조건 열 2–4, 규칙 행 3–7
@data conditions: 조건1, 조건2, 조건3 | rules: 예/아니오/— … → 결과(positive|neutral|negative)
HOW TO FILL
  1. C = 조건 열 수. 모든 행의 grid-template-columns:repeat(C,1fr) 1.3fr 의 C를 고친다.
  2. 조건 칸 값은 세 가지만: 예 · 아니오 · —(상관없음). 같은 형식으로 통일한다.
  3. 결과 칸 변형: 행동이 필요한 결과=강조 태그, 기록만=회색 태그, 숨김·차단=경고 태그.
  4. 행 하나 = ▼REPEAT 하나. 모든 조합을 쓰지 말고 결과가 달라지는 규칙만 쓴다.
-->
<div data-component="decision-table" style="border:1px solid ⟨border⟩; border-radius:⟨r:card-sm⟩; overflow:hidden; background:⟨white⟩;">
  <div style="display:grid; grid-template-columns:repeat(3,1fr) 1.3fr; background:⟨ink-900⟩;">
    <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨white⟩; padding:12px 16px;"><span style="font:700 9.5px/1 ⟨f:mono⟩; color:⟨muted-300⟩; display:block; margin-bottom:4px;">IF</span>⟦정책상 후속 기대⟧</div>
    <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨white⟩; padding:12px 16px;"><span style="font:700 9.5px/1 ⟨f:mono⟩; color:⟨muted-300⟩; display:block; margin-bottom:4px;">IF</span>⟦후속 링크 있음⟧</div>
    <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨white⟩; padding:12px 16px;"><span style="font:700 9.5px/1 ⟨f:mono⟩; color:⟨muted-300⟩; display:block; margin-bottom:4px;">IF</span>⟦열람 권한 있음⟧</div>
    <div style="font:600 12px/1.35 ⟨f:body⟩; color:⟨white⟩; padding:12px 16px; border-left:1px solid ⟨ink-700⟩;"><span style="font:700 9.5px/1 ⟨f:mono⟩; color:⟨muted-300⟩; display:block; margin-bottom:4px;">THEN</span>⟦결과⟧</div>
  </div>
  <!-- ▼ REPEAT per rule -->
  <div style="display:grid; grid-template-columns:repeat(3,1fr) 1.3fr; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div style="padding:11px 16px; font:600 12.5px/1.3 ⟨f:body⟩; color:⟨ink-800⟩;">⟦예⟧</div>
    <div style="padding:11px 16px; font:400 12.5px/1.3 ⟨f:body⟩; color:⟨muted-500⟩;">⟦아니오⟧</div>
    <div style="padding:11px 16px; font:600 12.5px/1.3 ⟨f:body⟩; color:⟨ink-800⟩;">⟦예⟧</div>
    <div style="padding:9px 16px; border-left:1px solid ⟨border-row⟩; background:⟨fill-50⟩;"><span style="font:600 11.5px/1 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1px solid ⟨accent-line⟩; border-radius:⟨r:pill-sm⟩; padding:5px 9px;">⟦Recovery 큐에 노출⟧</span></div>
  </div>
  <!-- ▲ /REPEAT -->
  <div style="display:grid; grid-template-columns:repeat(3,1fr) 1.3fr; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div style="padding:11px 16px; font:600 12.5px/1.3 ⟨f:body⟩; color:⟨ink-800⟩;">⟦예⟧</div>
    <div style="padding:11px 16px; font:600 12.5px/1.3 ⟨f:body⟩; color:⟨ink-800⟩;">⟦예⟧</div>
    <div style="padding:11px 16px; font:400 12.5px/1.3 ⟨f:body⟩; color:⟨muted-400⟩;">⟦—⟧</div>
    <div style="padding:9px 16px; border-left:1px solid ⟨border-row⟩; background:⟨fill-50⟩;"><span style="font:600 11.5px/1 ⟨f:body⟩; color:⟨muted-500⟩; background:⟨fill-100⟩; border:1px solid ⟨border-chip⟩; border-radius:⟨r:pill-sm⟩; padding:5px 9px;">⟦이력만 기록⟧</span></div>
  </div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr) 1.3fr; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div style="padding:11px 16px; font:400 12.5px/1.3 ⟨f:body⟩; color:⟨muted-500⟩;">⟦아니오⟧</div>
    <div style="padding:11px 16px; font:400 12.5px/1.3 ⟨f:body⟩; color:⟨muted-400⟩;">⟦—⟧</div>
    <div style="padding:11px 16px; font:400 12.5px/1.3 ⟨f:body⟩; color:⟨muted-400⟩;">⟦—⟧</div>
    <div style="padding:9px 16px; border-left:1px solid ⟨border-row⟩; background:⟨fill-50⟩;"><span style="font:600 11.5px/1 ⟨f:body⟩; color:⟨muted-500⟩; background:⟨fill-100⟩; border:1px solid ⟨border-chip⟩; border-radius:⟨r:pill-sm⟩; padding:5px 9px;">⟦큐 제외⟧</span></div>
  </div>
  <!-- VARIANT negative result -->
  <div style="display:grid; grid-template-columns:repeat(3,1fr) 1.3fr; border-top:1px solid ⟨border-row⟩; align-items:center;">
    <div style="padding:11px 16px; font:600 12.5px/1.3 ⟨f:body⟩; color:⟨ink-800⟩;">⟦예⟧</div>
    <div style="padding:11px 16px; font:400 12.5px/1.3 ⟨f:body⟩; color:⟨muted-500⟩;">⟦아니오⟧</div>
    <div style="padding:11px 16px; font:400 12.5px/1.3 ⟨f:body⟩; color:⟨muted-500⟩;">⟦아니오⟧</div>
    <div style="padding:9px 16px; border-left:1px solid ⟨border-row⟩; background:⟨fill-50⟩;"><span style="font:600 11.5px/1 ⟨f:body⟩; color:⟨warn⟩; background:⟨warn-bg⟩; border:1px solid ⟨warn-line⟩; border-radius:⟨r:pill-sm⟩; padding:5px 9px;">⟦요약만 표시⟧</span></div>
  </div>
</div>
