<!--
@component sequence
@kind figure
@order 60
@shape interaction
@title UML 시퀀스 — 참여자 간 요청·응답 순서
@use 둘 이상의 참여자(사용자·서비스·DB·외부 시스템)가 정해진 순서로 요청과 응답을 주고받는다. API 호출, 시스템 연동, 인증, 동기화.
@avoid 참여자 1명의 단계 → process-row. "다음은 누가"가 핵심인 사람 업무 → swimlane. 조건별 결말 → activity.
@limits 참여자 2–5, 메시지 3–10, ALT/OPT 묶음 0–2
@data participants: 참여자 A, 참여자 B, 참여자 C | messages: A→B 요청 1 · B→C 요청 2 · C⇢B 응답 2 · B↻ 내부 처리 · B⇢A 최종 응답 | alt?: 조건 = 메시지 번호들 · 예정·미구현 구간 = 메시지 번호들 [planned]   (→ 요청, ⇢ 응답, ↻ 내부 처리. ASCII 대체: -> 요청 · 응답은 하이픈 두 개+꺾쇠 · (self) 내부 처리)
HOW TO FILL
  1. N = 참여자 수. N 은 이 컴포넌트의 모든 repeat(N,1fr) 와 모든 calc(100% / N) 에 같은 값으로 들어간다(게이트가 검사한다):
       참여자 행·모든 메시지 행·ALT 안의 행   grid-template-columns:repeat(N,1fr)
       생명선(lifeline) 배경                  background-size:calc(100% / N) 100%
  2. 참여자 변형: 주 행위자=채운 강조, 핵심 시스템=강조 테두리, 저장소·외부=점선.
  3. 메시지 한 개 = 메시지 행 한 개. 위에서 아래로 시간 순서. 번호를 1부터 붙인다.
       grid-column: 작은 참여자 번호 / 큰 참여자 번호+1
       margin: 0 X%   (S = 큰번호−작은번호+1: S=2 → 25%, 3 → 16.667%, 4 → 12.5%, 5 → 10%)
       오른쪽으로 보내면 →변형, 왼쪽으로 보내면 ←변형.
     요청(call)=실선 강조색, 응답(return)=점선 회색.
  4. 한 참여자 안의 처리(검증·계산·저장 판단)는 "내부 처리" 칩: grid-column: 그 참여자 번호.
  5. 조건부 구간은 ALT 박스로 감싼다(라벨: "ALT 조건"). 반복은 "LOOP 조건". 선택 구간은 "OPT 조건".
     아직 없는 구간(예정·미구현)은 figure-data 에서 구간 뒤 "[planned]" 로 적고 예정 프레임(OPT 변형)으로 그린다:
       프레임 = 흐린 점선 테두리, 라벨 = 회색 칩 "OPT 예정·미구현"(칩 문구는 출처의 상태 그대로: 예정·계획·미설계·미구현·대기),
       그 안의 요청 화살표는 회색 실선(muted 변형), 응답은 원래 점선 회색 그대로. 구축된 구간과 같은 모양으로 그리지 않는다(core/components.md §4 공통 규칙).
  6. figure-data 의 메시지 방향 기호는 → ⇢ ↻ 외에 ASCII 로 적어도 된다: 요청 ->, 응답은 하이픈 두 개+꺾쇠, 내부 처리 (self).
  7. N=5 참여자(가장 빽빽한 경우)는 칸 폭이 N=3 의 60% 라 글자가 넘치기 쉽다. 다음을 지킨다:
       생명선 컨테이너의 max-width:760px 를 900px 로 키운다(시트 안 도해 폭 한도, 칸 폭은 N=3 의 약 70%가 된다).
       참여자 이름과 메시지 라벨은 한 줄에 한글 약 14자 이하, 두 줄까지만 쓴다(참여자 상자는 약 12자에서 줄이 바뀐다).
       두 줄을 넘는 설명은 라벨이 아니라 그림 아래 각주("* 3 — …")로 옮기고, 라벨에는 번호와 핵심어만 남긴다.
       그래도 넘치면 참여자를 4명 이하로 줄이거나 그림을 둘로 나눈다.
  8. 프레임 키워드 ⟦ALT⟧ · ⟦OPT⟧(반복은 LOOP)는 슬롯이다. 예시는 UML 영문 키워드 기본(labels: en)이다. labels: ko 문서(사용자용)는
     "분기" · "선택" · "반복" 으로 바꾼다(core/components.md §4 "라벨 언어"). 프레임 라벨은 11px 이상으로 읽히게 둔다.
-->
<div data-component="sequence" style="background:⟨fig-tint⟩; border:1px solid ⟨border-fig⟩; border-radius:⟨r:card-sm⟩; padding:24px 24px 20px;">
  <!-- lifelines: background-size = calc(100% / N) -->
  <div style="max-width:760px; margin:0 auto; background-image:linear-gradient(90deg, transparent calc(50% - 1px), ⟨dashed-rule⟩ calc(50% - 1px), ⟨dashed-rule⟩ calc(50% + 1px), transparent calc(50% + 1px)); background-size:calc(100% / 3) 100%; padding-bottom:10px;">
    <!-- participants: repeat(N,1fr) -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); margin-bottom:8px;">
      <div style="justify-self:center; max-width:92%; font:600 12px/1.3 ⟨f:body⟩; color:⟨white⟩; background:⟨accent⟩; border-radius:⟨r:node⟩; padding:9px 14px; text-align:center;">⟦참여자 A⟧</div>
      <div style="justify-self:center; max-width:92%; font:600 12px/1.3 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; padding:9px 14px; text-align:center;">⟦참여자 B⟧</div>
      <div style="justify-self:center; max-width:92%; font:600 12px/1.3 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px dashed ⟨dashed-store⟩; border-radius:⟨r:node⟩; padding:9px 14px; text-align:center;">⟦참여자 C⟧</div>
    </div>

    <!-- message 1 — call →, participant 1 to 2 (grid-column 1 / 3, S=2 → margin 0 25%) -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); padding:6px 0;">
      <div style="grid-column:1 / 3; margin:0 25%;">
        <div style="text-align:center; margin-bottom:3px;"><span style="font:500 11px/1.4 ⟨f:body⟩; color:⟨ink-700⟩; background:⟨fig-tint⟩; padding:0 5px;"><b style="font:700 10px/1 ⟨f:mono⟩; color:⟨accent⟩;">1</b> ⟦요청 1⟧</span></div>
        <div style="display:flex; align-items:center;"><div style="flex:1; height:2px; background:⟨accent⟩;"></div><div style="width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:8px solid ⟨accent⟩;"></div></div>
      </div>
    </div>
    <!-- message 2 — call →, participant 2 to 3 -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); padding:6px 0;">
      <div style="grid-column:2 / 4; margin:0 25%;">
        <div style="text-align:center; margin-bottom:3px;"><span style="font:500 11px/1.4 ⟨f:body⟩; color:⟨ink-700⟩; background:⟨fig-tint⟩; padding:0 5px;"><b style="font:700 10px/1 ⟨f:mono⟩; color:⟨accent⟩;">2</b> ⟦요청 2⟧</span></div>
        <div style="display:flex; align-items:center;"><div style="flex:1; height:2px; background:⟨accent⟩;"></div><div style="width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:8px solid ⟨accent⟩;"></div></div>
      </div>
    </div>
    <!-- message 3 — return ← (dashed), participant 3 to 2 -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); padding:6px 0;">
      <div style="grid-column:2 / 4; margin:0 25%;">
        <div style="text-align:center; margin-bottom:3px;"><span style="font:500 11px/1.4 ⟨f:body⟩; color:⟨muted-text⟩; background:⟨fig-tint⟩; padding:0 5px;"><b style="font:700 10px/1 ⟨f:mono⟩; color:⟨muted-text⟩;">3</b> ⟦응답 2⟧</span></div>
        <div style="display:flex; align-items:center;"><div style="width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-right:8px solid ⟨slate⟩;"></div><div style="flex:1; border-top:2px dashed ⟨slate⟩;"></div></div>
      </div>
    </div>
    <!-- self / internal processing on participant 2 -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); padding:6px 0;">
      <div style="grid-column:2; justify-self:center; max-width:94%; font:500 11px/1.35 ⟨f:body⟩; color:⟨accent-ink⟩; background:⟨accent-050⟩; border:1px solid ⟨accent-line⟩; border-radius:⟨r:pill-sm⟩; padding:5px 10px; text-align:center;"><b style="font:700 10px/1 ⟨f:mono⟩; color:⟨accent⟩;">4</b> ↻ ⟦내부 처리⟧</div>
    </div>
    <!-- ALT block: wrap conditional message rows -->
    <div style="border:1px dashed ⟨accent-line⟩; border-radius:⟨r:node⟩; margin:6px 0;">
      <div style="display:inline-block; font:700 11px/1 ⟨f:mono⟩; letter-spacing:.04em; color:⟨accent⟩; background:⟨accent-050⟩; padding:5px 8px; border-radius:⟨r:node⟩ 0 ⟨r:node⟩ 0;">⟦ALT⟧ ⟦조건⟧</div>
      <!-- message 5 — return ← (dashed), participant 2 to 1 -->
      <div style="display:grid; grid-template-columns:repeat(3,1fr); padding:2px 0 8px;">
        <div style="grid-column:1 / 3; margin:0 25%;">
          <div style="text-align:center; margin-bottom:3px;"><span style="font:500 11px/1.4 ⟨f:body⟩; color:⟨muted-text⟩; background:⟨fig-tint⟩; padding:0 5px;"><b style="font:700 10px/1 ⟨f:mono⟩; color:⟨muted-text⟩;">5</b> ⟦오류 응답⟧</span></div>
          <div style="display:flex; align-items:center;"><div style="width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-right:8px solid ⟨slate⟩;"></div><div style="flex:1; border-top:2px dashed ⟨slate⟩;"></div></div>
        </div>
      </div>
    </div>
    <!-- message 6 — return ← (dashed), participant 2 to 1 -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); padding:6px 0;">
      <div style="grid-column:1 / 3; margin:0 25%;">
        <div style="text-align:center; margin-bottom:3px;"><span style="font:500 11px/1.4 ⟨f:body⟩; color:⟨muted-text⟩; background:⟨fig-tint⟩; padding:0 5px;"><b style="font:700 10px/1 ⟨f:mono⟩; color:⟨muted-text⟩;">6</b> ⟦최종 응답⟧</span></div>
        <div style="display:flex; align-items:center;"><div style="width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-right:8px solid ⟨slate⟩;"></div><div style="flex:1; border-top:2px dashed ⟨slate⟩;"></div></div>
      </div>
    </div>
    <!-- VARIANT planned frame (OPT 예정·미구현, [planned]): the messages inside are not built — muted dashed frame + muted label chip + muted call arrow -->
    <div style="border:1px dashed ⟨muted-300⟩; border-radius:⟨r:node⟩; margin:6px 0;">
      <div style="display:inline-block; font:700 11px/1 ⟨f:mono⟩; letter-spacing:.04em; color:⟨muted-text⟩; background:⟨fill-50⟩; padding:5px 8px; border-radius:⟨r:node⟩ 0 ⟨r:node⟩ 0;">⟦OPT⟧ ⟦예정·미구현⟧</div>
      <!-- message 7 — planned call → (muted solid), participant 2 to 3 -->
      <div style="display:grid; grid-template-columns:repeat(3,1fr); padding:2px 0 8px;">
        <div style="grid-column:2 / 4; margin:0 25%;">
          <div style="text-align:center; margin-bottom:3px;"><span style="font:500 11px/1.4 ⟨f:body⟩; color:⟨muted-text⟩; background:⟨fig-tint⟩; padding:0 5px;"><b style="font:700 10px/1 ⟨f:mono⟩; color:⟨muted-text⟩;">7</b> ⟦예정 요청⟧</span></div>
          <div style="display:flex; align-items:center;"><div style="flex:1; height:2px; background:⟨muted-300⟩;"></div><div style="width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:8px solid ⟨muted-300⟩;"></div></div>
        </div>
      </div>
    </div>
    <!-- VARIANT call ← (solid, leftward): arrowhead first, border-right:8px solid accent; then the solid line
    <div style="display:flex; align-items:center;"><div style="width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-right:8px solid ⟨accent⟩;"></div><div style="flex:1; height:2px; background:⟨accent⟩;"></div></div>
    -->
  </div>
  <div style="font:400 11.5px/1.55 ⟨f:body⟩; color:⟨muted-text⟩; margin-top:10px;">* 실선 = 요청 · 점선 = 응답 · ↻ = 참여자 내부 처리</div>
</div>
