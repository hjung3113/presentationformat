<!--
@component kpi-row
@kind chart
@order 230
@shape headline-metric
@title 핵심 지표 타일 — 숫자와 증감
@use 숫자 1–4개 자체가 메시지다. 기간 대비 증감, 목표 대비 현재, 보고서 첫 화면의 요약 지표.
@avoid 항목이 5개 이상이거나 서로 비교가 핵심 → bar-chart/hbar-chart. 수치가 아직 없다 → 지표 대신 "O (추후 확정)" 자리표시.
@limits 타일 2–4
@data tiles: 라벨=값 단위 (증감 ▲/▼ 값, good|bad) · 부가설명
HOW TO FILL
  1. 타일 수 K에 맞춰 grid-template-columns:repeat(K,1fr). 타일 하나 = ▼REPEAT 하나.
  2. 증감 배지 색은 방향이 아니라 좋고 나쁨으로: 좋아짐=성공색 ▲/▼, 나빠짐=경고색 ▲/▼. 증감이 없으면 배지를 지운다.
  3. 이 문서가 가장 강조하는 지표 하나만 강조 타일 변형으로.
  4. 아직 측정 전이면 값 자리에 굵은 O 와 회색 "(추후 확정)"을 쓴다. 경고색을 쓰지 않는다.
-->
<div data-component="kpi-row" style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px;">
  <!-- VARIANT highlight tile (the one metric the section argues) -->
  <div style="background:⟨accent-050⟩; border:1px solid ⟨accent-line2⟩; border-radius:⟨r:card-sm⟩; padding:16px 18px;">
    <div style="font:500 12px/1.4 ⟨f:body⟩; color:⟨body⟩;">⟦후속 연결률⟧</div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-top:10px;"><span style="font:700 30px/1 ⟨f:display⟩; color:⟨accent⟩;">⟦74⟧<span style="font:700 16px/1 ⟨f:display⟩;">⟦%⟧</span></span><span style="font:700 11px/1 ⟨f:mono⟩; color:⟨ok⟩; background:⟨ok-bg⟩; border-radius:⟨r:pill-sm⟩; padding:4px 7px;">⟦▲ 12p⟧</span></div>
    <div style="font:400 11.5px/1.5 ⟨f:body⟩; color:⟨muted-400⟩; margin-top:8px;">⟦전 분기 62%⟧</div>
  </div>
  <!-- ▼ REPEAT per tile -->
  <div style="background:⟨white⟩; border:1px solid ⟨border⟩; border-radius:⟨r:card-sm⟩; padding:16px 18px;">
    <div style="font:500 12px/1.4 ⟨f:body⟩; color:⟨body⟩;">⟦미처리 VOC⟧</div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-top:10px;"><span style="font:700 30px/1 ⟨f:display⟩; color:⟨ink-900⟩;">⟦47⟧<span style="font:700 16px/1 ⟨f:display⟩;">⟦건⟧</span></span><span style="font:700 11px/1 ⟨f:mono⟩; color:⟨ok⟩; background:⟨ok-bg⟩; border-radius:⟨r:pill-sm⟩; padding:4px 7px;">⟦▼ 9⟧</span></div>
    <div style="font:400 11.5px/1.5 ⟨f:body⟩; color:⟨muted-400⟩; margin-top:8px;">⟦지난주 56건⟧</div>
  </div>
  <!-- ▲ /REPEAT -->
  <!-- VARIANT worsened (bad direction = warning colour) -->
  <div style="background:⟨white⟩; border:1px solid ⟨border⟩; border-radius:⟨r:card-sm⟩; padding:16px 18px;">
    <div style="font:500 12px/1.4 ⟨f:body⟩; color:⟨body⟩;">⟦평균 첫 응답⟧</div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-top:10px;"><span style="font:700 30px/1 ⟨f:display⟩; color:⟨ink-900⟩;">⟦31⟧<span style="font:700 16px/1 ⟨f:display⟩;">⟦h⟧</span></span><span style="font:700 11px/1 ⟨f:mono⟩; color:⟨warn⟩; background:⟨warn-bg⟩; border-radius:⟨r:pill-sm⟩; padding:4px 7px;">⟦▲ 6h⟧</span></div>
    <div style="font:400 11.5px/1.5 ⟨f:body⟩; color:⟨muted-400⟩; margin-top:8px;">⟦목표 24h⟧</div>
  </div>
  <!-- VARIANT not yet measured -->
  <div style="background:⟨white⟩; border:1px solid ⟨border⟩; border-radius:⟨r:card-sm⟩; padding:16px 18px;">
    <div style="font:500 12px/1.4 ⟨f:body⟩; color:⟨body⟩;">⟦결과 설문 응답률⟧</div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-top:10px;"><span style="font:700 30px/1 ⟨f:display⟩; color:⟨ink-900⟩;">O<span style="font:700 16px/1 ⟨f:display⟩;">%</span></span></div>
    <div style="font:400 11.5px/1.5 ⟨f:body⟩; color:⟨muted-400⟩; margin-top:8px;">⟦(추후 확정)⟧</div>
  </div>
</div>
