<!--
@component activity
@kind figure
@order 30
@shape branching-flow
@title UML 액티비티 — 분기·여러 결말이 있는 흐름
@use 판단 지점에서 흐름이 갈라진다: 승인/반려, 충분/부족, 조건별 처리, 재시도, "아무것도 하지 않음"도 정당한 결말인 흐름.
@avoid 분기 없이 일직선 → process-row. 누가 다음에 행동하는지가 핵심 → swimlane. 상태값의 전이가 핵심 → state-machine.
@limits 판단 1–2개, 결말 2–5개
@data start: 시작 | actions: 행동 → 행동 | decision: 질문? | outcomes: [라벨] 결말(종류: target|normal|negative), … | loop: 결말 → 되돌아갈 곳 | end: 종료(선택)
HOW TO FILL
  1. 위에서 아래로: 시작 → 행동(1–3개) → 판단(마름모) → 결말 칸들 → (선택) 합류 → 종료.
  2. 결말 칸 수 K에 맞춰 두 곳을 고친다:
       결말 그리드  grid-template-columns:repeat(K,1fr)
       분기 레일    margin:0 X%   (K=2 → 25%, K=3 → 16.667%, K=4 → 12.5%, K=5 → 10%)
  3. 결말 칸마다 분기 라벨 태그를 단다: 긍정=성공색 태그, 부정=경고색 태그, 중립=회색 태그.
  4. 결말 노드 변형: 목표 결말=강조 노드, 보통=흰 노드, 반려·중단=경고 노드(사유 한 줄 포함).
     "후속 없음"·"반려"·"근거 부족"도 정당한 결말이면 각주가 아니라 결말 칸으로 그린다.
  5. 되돌아가는 경로는 해당 결말 아래 ↺ 칩으로 적는다(어디로 돌아가는지 명시).
  6. 동시에 진행되는 작업은 ▼OPTIONAL 병렬 블록(포크/조인 막대)을 쓴다.
-->
<div data-component="activity" style="background:⟨fig-tint⟩; border:1px solid ⟨border-fig⟩; border-radius:⟨r:card-sm⟩; padding:26px 24px;">
  <div style="max-width:700px; margin:0 auto; display:flex; flex-direction:column; align-items:center;">
    <!-- start -->
    <div style="font:600 12px/1 ⟨f:body⟩; color:⟨white⟩; background:⟨ink-900⟩; border-radius:⟨r:pill⟩; padding:10px 18px;">● ⟦VOC 접수⟧</div>
    <div style="color:⟨muted-300⟩; font:400 14px/1 ⟨f:body⟩; padding:6px 0;">↓</div>
    <!-- ▼ REPEAT per action before the decision (1–3) -->
    <div style="width:100%; max-width:300px; font:600 12.5px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node-lg⟩; padding:11px 12px; text-align:center;">⟦트리아지⟧<span style="display:block; font:400 10.5px/1.45 ⟨f:body⟩; color:⟨muted-400⟩; margin-top:3px;">⟦담당·심각도 결정⟧</span></div>
    <div style="color:⟨muted-300⟩; font:400 14px/1 ⟨f:body⟩; padding:6px 0;">↓</div>
    <!-- ▲ /REPEAT -->
    <!-- decision diamond (question ≤ 10자 권장) -->
    <div style="position:relative; width:150px; height:96px; display:flex; align-items:center; justify-content:center;">
      <div style="position:absolute; left:41px; top:14px; width:68px; height:68px; transform:rotate(45deg); background:⟨white⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩;"></div>
      <div style="position:relative; font:600 11.5px/1.3 ⟨f:body⟩; color:⟨accent⟩; text-align:center; max-width:120px;">⟦후속 조치?⟧</div>
    </div>
    <!-- branch rail: margin = 50/K % (K = number of outcomes) -->
    <div style="align-self:stretch; height:12px; margin:0 12.5%; border:2px solid ⟨muted-300⟩; border-bottom:none; border-radius:⟨r:node⟩ ⟨r:node⟩ 0 0;"></div>
    <!-- outcomes: repeat(K,1fr) -->
    <div style="align-self:stretch; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;">
      <!-- ▼ REPEAT per outcome (2–5) -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <span style="font:700 10.5px/1 ⟨f:body⟩; color:⟨ok⟩; background:⟨ok-bg⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦실행 필요⟧</span>
        <div style="align-self:stretch; font:600 12px/1.35 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; padding:10px 8px; text-align:center;">⟦Task Request⟧<span style="display:block; font:400 10.5px/1.4 ⟨f:body⟩; color:⟨body⟩; margin-top:3px;">⟦검토 큐로⟧</span></div>
      </div>
      <!-- ▲ /REPEAT -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <span style="font:700 10.5px/1 ⟨f:body⟩; color:⟨muted-500⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦근거 종합⟧</span>
        <div style="align-self:stretch; font:600 12px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px 8px; text-align:center;">⟦Finding 작성⟧<span style="display:block; font:400 10.5px/1.4 ⟨f:body⟩; color:⟨muted-400⟩; margin-top:3px;">⟦여러 VOC 묶음⟧</span></div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <span style="font:700 10.5px/1 ⟨f:body⟩; color:⟨muted-500⟩; background:⟨fill-100⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦정보 부족⟧</span>
        <div style="align-self:stretch; font:600 12px/1.35 ⟨f:body⟩; color:⟨ink-800⟩; background:⟨white⟩; border:1px solid ⟨border-node⟩; border-radius:⟨r:node⟩; padding:10px 8px; text-align:center;">⟦정보 요청⟧<span style="display:block; font:400 10.5px/1.4 ⟨f:body⟩; color:⟨muted-400⟩; margin-top:3px;">⟦작성자에게⟧</span></div>
        <!-- OPTIONAL loop-back chip -->
        <span style="font:500 10.5px/1.3 ⟨f:body⟩; color:⟨accent⟩; border:1px dashed ⟨accent-line⟩; border-radius:⟨r:pill⟩; padding:4px 9px;">↺ ⟦답변 후 트리아지로⟧</span>
      </div>
      <!-- VARIANT negative / no-execution outcome -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <span style="font:700 10.5px/1 ⟨f:body⟩; color:⟨warn⟩; background:⟨warn-bg⟩; border-radius:⟨r:pill-sm⟩; padding:4px 8px;">⟦조치 불필요⟧</span>
        <div style="align-self:stretch; font:600 12px/1.35 ⟨f:body⟩; color:⟨warn⟩; background:⟨warn-bg⟩; border:1px solid ⟨warn-line⟩; border-radius:⟨r:node⟩; padding:10px 8px; text-align:center;">⟦후속 없음 종료⟧<span style="display:block; font:400 10.5px/1.4 ⟨f:body⟩; color:⟨warn-2⟩; margin-top:3px;">⟦사유 기록⟧</span></div>
      </div>
    </div>
    <!-- OPTIONAL merge + end: delete both lines below if every outcome is terminal -->
    <div style="color:⟨muted-300⟩; font:500 11px/1 ⟨f:body⟩; padding:12px 0 6px;">▼ ⟦합류⟧</div>
    <div style="font:600 12px/1 ⟨f:body⟩; color:⟨white⟩; background:⟨ok⟩; border-radius:⟨r:pill⟩; padding:10px 18px;">◉ ⟦작성자에게 상태 공개⟧</div>
    <!-- ▼ OPTIONAL parallel block (fork/join): place between actions when work runs concurrently
    <div style="align-self:stretch; max-width:360px; margin:0 auto;">
      <div style="height:6px; background:⟨accent⟩; border-radius:3px;"></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:10px 0;">
        <div style="font:500 11.5px/1.3 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1px solid ⟨accent-line⟩; border-radius:⟨r:node⟩; padding:9px; text-align:center;">⟦병렬 작업 A⟧</div>
        <div style="font:500 11.5px/1.3 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; border:1px solid ⟨accent-line⟩; border-radius:⟨r:node⟩; padding:9px; text-align:center;">⟦병렬 작업 B⟧</div>
      </div>
      <div style="height:6px; background:⟨accent⟩; border-radius:3px;"></div>
    </div>
    ▲ /OPTIONAL -->
  </div>
</div>
