<!--
@component class-diagram
@kind figure
@order 100
@shape code-structure
@title UML 클래스 — 상속·구현과 핵심 속성·메서드
@use 코드 구조가 주장이다: 상위 타입(인터페이스·추상 클래스)과 그것을 구현·상속하는 하위 타입, 각 타입의 핵심 속성·메서드.
@avoid 도메인 개념 간 관계·카디널리티 → er-relations. 모듈 배치와 층 → layer-map.
@limits 상위 1, 하위 2–4, 클래스당 속성·메서드 1–4줄
@data parent: «interface» 이름(+메서드) | children: 이름(+속성, +메서드) … | relation?: implements|extends
HOW TO FILL
  1. K = 하위 클래스 수. 하위 그리드 repeat(K,1fr) 과 가로 레일 margin(K=2 → 25%, 3 → 16.667%, 4 → 12.5%)을 고친다.
  2. 클래스 상자: 이름 띠(스테레오타입은 «interface» 같이 작게) + 속성 칸 + 메서드 칸(mono, + public / − private).
  3. 상속·구현 표시: 상위 상자 바로 아래 △ 와 라벨(extends / implements). 실선=상속, 점선=구현.
-->
<div data-component="class-diagram" style="background:⟨fig-tint⟩; border:1px solid ⟨border-fig⟩; border-radius:⟨r:card-sm⟩; padding:24px;">
  <div style="display:flex; flex-direction:column; align-items:center;">
    <!-- parent -->
    <div style="min-width:220px; border:1.5px solid ⟨accent⟩; border-radius:⟨r:node⟩; overflow:hidden; background:⟨white⟩;">
      <div style="background:⟨accent-050⟩; padding:8px 14px; text-align:center; border-bottom:1px solid ⟨accent-line⟩;"><div style="font:500 10px/1.2 ⟨f:mono⟩; color:⟨muted-text⟩;">⟦«interface»⟧</div><div style="font:600 12.5px/1.3 ⟨f:body⟩; color:⟨accent⟩;">⟦Notifier⟧</div></div>
      <div style="padding:7px 14px; font:500 10.5px/1.75 ⟨f:mono⟩; color:⟨body⟩;">⟦+ send(event)⟧<br>⟦+ supports(channel)⟧</div>
    </div>
    <div style="font:400 15px/1 ⟨f:body⟩; color:⟨accent⟩; margin-top:2px;">△</div>
    <div style="font:500 10px/1 ⟨f:mono⟩; color:⟨muted-text⟩; padding:2px 0 4px;">⟦implements⟧</div>
    <div style="width:0; height:10px; border-left:2px dashed ⟨accent-line⟩;"></div>
    <!-- rail: margin = 50/K % -->
    <div style="align-self:stretch; margin:0 16.667%; border-top:2px dashed ⟨accent-line⟩;"></div>
    <div style="align-self:stretch; display:grid; grid-template-columns:repeat(3,1fr); gap:16px;">
      <!-- ▼ REPEAT per child class -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:0; height:14px; border-left:2px dashed ⟨accent-line⟩;"></div>
        <div style="align-self:stretch; border:1px solid ⟨accent⟩; border-radius:⟨r:node⟩; overflow:hidden; background:⟨white⟩;">
          <div style="font:600 12px/1.3 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; padding:8px 12px; text-align:center; border-bottom:1px solid ⟨accent-line⟩;">⟦EmailNotifier⟧</div>
          <div style="padding:6px 12px; border-bottom:1px solid ⟨border⟩; font:500 10.5px/1.7 ⟨f:mono⟩; color:⟨body⟩;">⟦− smtpHost⟧</div>
          <div style="padding:6px 12px; font:500 10.5px/1.7 ⟨f:mono⟩; color:⟨body⟩;">⟦+ send(event)⟧</div>
        </div>
      </div>
      <!-- ▲ /REPEAT -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:0; height:14px; border-left:2px dashed ⟨accent-line⟩;"></div>
        <div style="align-self:stretch; border:1px solid ⟨accent⟩; border-radius:⟨r:node⟩; overflow:hidden; background:⟨white⟩;">
          <div style="font:600 12px/1.3 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; padding:8px 12px; text-align:center; border-bottom:1px solid ⟨accent-line⟩;">⟦SlackNotifier⟧</div>
          <div style="padding:6px 12px; border-bottom:1px solid ⟨border⟩; font:500 10.5px/1.7 ⟨f:mono⟩; color:⟨body⟩;">⟦− webhookUrl⟧</div>
          <div style="padding:6px 12px; font:500 10.5px/1.7 ⟨f:mono⟩; color:⟨body⟩;">⟦+ send(event)⟧</div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:0; height:14px; border-left:2px dashed ⟨accent-line⟩;"></div>
        <div style="align-self:stretch; border:1px solid ⟨accent⟩; border-radius:⟨r:node⟩; overflow:hidden; background:⟨white⟩;">
          <div style="font:600 12px/1.3 ⟨f:body⟩; color:⟨accent⟩; background:⟨accent-050⟩; padding:8px 12px; text-align:center; border-bottom:1px solid ⟨accent-line⟩;">⟦InAppNotifier⟧</div>
          <div style="padding:6px 12px; border-bottom:1px solid ⟨border⟩; font:500 10.5px/1.7 ⟨f:mono⟩; color:⟨body⟩;">⟦− inbox⟧</div>
          <div style="padding:6px 12px; font:500 10.5px/1.7 ⟨f:mono⟩; color:⟨body⟩;">⟦+ send(event)⟧</div>
        </div>
      </div>
    </div>
  </div>
</div>
