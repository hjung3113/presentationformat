@component gantt

HOW TO FILL
  1. P = 기간 열 수. 세 곳의 P를 같은 값으로:
       헤더 행·모든 작업 행   grid-template-columns:150px repeat(P,1fr)

       s번째 기간부터 e번째 기간까지 → grid-column: (s+1) / (e+2)
       예) P=6, 2~4번째 기간 → grid-column:3 / 6
  3. 막대 변형: 확정 범위(core)=강조색, 부분·최소(partial)=연한 강조색, 이후 예정(planned)=테두리만, 지연 위험(risk)=경고색.

  4. 마일스톤은 ◆ 행: grid-column: k+1 (그 기간 칸 하나).
  5. (선택) 현재 기간 헤더를 강조색 글자로.
