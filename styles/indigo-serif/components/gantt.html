<!--
@component gantt
@kind report

@shape schedule
@title 간트 — 기간에 걸친 작업 일정

@avoid 날짜 하나짜리 사건 → timeline. 진척률만 → hbar-chart/status-board.
@limits 기간 열 3–12, 작업 행 3–8, 한 행에 막대 2개까지
@data periods: 기간 1, 기간 2, … | rows: 작업명 = 시작–끝 (core|partial|planned|risk|legacy) [+ 시작–끝 (종류)] | milestones?: 기간: 이름 [(cutover)]
HOW TO FILL
  1. P = 기간 열 수. P 는 이 컴포넌트의 모든 repeat(P,1fr) 와 calc(100% / P) 에 같은 값으로 들어간다(게이트가 검사한다):
       헤더 행·모든 작업 행·마일스톤 행   grid-template-columns:150px repeat(P,1fr)
       세로 눈금                           background-size:calc(100% / P) 100%
  2. 막대 위치는 계산 없이 열 번호로: 기간 k 는 선 k+1 에서 시작한다.
       s번째 기간부터 e번째 기간까지 → grid-column: (s+1) / (e+2)
       예) P=6, 2~4번째 기간 → grid-column:3 / 6
  3. 막대 변형: 확정 범위(core)=강조색, 부분·최소(partial)=연한 강조색, 이후 예정(planned)=테두리만, 지연 위험(risk)=경고색,
     기존 체제·병행 운영(legacy)=회색(slate, AS-IS 색). 새 체제(core)와 기존 체제(legacy)를 같은 색으로 칠하지 않는다.
     같은 종류의 막대는 같은 변형을 쓴다. 막대 안 글자는 2–6자 또는 비운다(범례가 색을 설명하면 비운다).
  4. 한 행에 막대 둘(작업 = P1–P2 (legacy) + P3–P5 (core)):
       기간이 겹치지 않으면 두 막대를 같은 행에 그대로 놓는다.
       병행 운영처럼 기간이 겹치면 "겹침 행" 변형: 두 막대에 grid-row:1 을 주고 legacy 는 위(align-self:start), 새 체제는 아래(align-self:end)에
       반 높이로 쌓는다. 겹침 행은 글자를 비우고 min-height:40px.
  5. 마일스톤은 ◆ 행: grid-column: k+1 (그 기간 칸 하나). 기존 체제를 끄고 신규 체제로 넘어가는 시점은 어두운 알약 변형 "◆ 컷오버"(cutover).
  6. (선택) 현재 기간 헤더를 강조색 글자로.
  7. figure-data 의 시작–끝 은 기간 이름이 아니라 기간 번호 또는 이름 둘 다 허용한다(예: P1–P2, 1월–2월).
