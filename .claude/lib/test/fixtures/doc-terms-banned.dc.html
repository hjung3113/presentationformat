<body>
  <i style="color:#1428A0"></i>
  <section id="s1">
    <h2>접수와 작업</h2>
    <p>접수(VOC)는 사용자가 문제를 올리는 첫 단계이고, 담당자는 이를 작업(Task)으로 옮긴다. 접수 가운데 <b>40%</b>가 작업으로 이어진다.</p>
  </section>
  <section id="s2">
    <h2>결과 확인</h2>
    <p>태스크가 끝나면 결과 확인 설문이 사용자에게 간다. 인입 건수는 따로 세지 않는다.</p>
  </section>
  <section id="sref">
    <h2>부록</h2>
    <p>용어 — 인입과 태스크는 접수와 작업의 옛 이름이다.</p>
  </section>
</body>
